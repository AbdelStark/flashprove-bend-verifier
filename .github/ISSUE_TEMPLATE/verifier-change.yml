name: Verifier change
description: Implement a protocol rule or investigate a conformance mismatch.
body:
  - type: markdown
    attributes:
      value: "For a suspected unsound acceptance or a failure on hostile input, follow the [security reporting instructions](https://github.com/AbdelStark/flashprove-bend-verifier/blob/main/SECURITY.md)."
  - type: textarea
    id: rule
    attributes:
      label: What should the verifier do?
      description: Name the stage, the format rule or pinned source function, and the requirement this change serves.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Prerequisites
      description: List issues that must land first and add them under the issue's “Blocked by” relationship.
  - type: textarea
    id: evidence
    attributes:
      label: How can we check the change?
      description: Give a fixture or safe test input, the command and the expected verdict or intermediate value. For a speed change, identify the workload and baseline.
    validations:
      required: true
