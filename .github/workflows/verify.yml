name: Verify FlashProve proofs
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make ci
      # A new seed per commit: the cases differ from run to run and a failure names its seed.
      - run: make fuzz FUZZ_ARGS="-n 32 --seed ${{ github.sha }}"
      - if: github.event_name == 'workflow_dispatch'
        run: make e2e-full e2e-extended standalone-extended
      - if: github.event_name == 'workflow_dispatch'
        run: make fuzz FUZZ_ARGS="-n 250 --seed ${{ github.sha }}-extended"
